name: Deploy to GitHub Pages

# 把 dist/ 发到 https://waterbird-i.github.io/A-Plus/
# 为什么用 Actions 而不是往 gh-pages 分支推文件：那样每次都得在本地构建完再推，
# 迟早会和 main 上的代码不一致（链接还是旧的，却没人知道）。这里每次 push 都重建。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
